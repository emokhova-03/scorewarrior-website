{{define "content"}}

<section>
    <h1>Careers</h1>

    {{if .LoadError}}
    <p>Unable to load open roles right now</p>
    {{else if .Roles}}
        {{range .Roles}}
       <article>
            <h2>
                <a href="/careers/{{.Slug}}">{{.Title}}</a>
            </h2>
            <p>{{.Department}}</p>
            <p>{{.Location}}</p>
       </article>
       {{end}}
    {{else}}
        <p>No openings right now.</p>
    {{end}}
</section>

{{end}}
