name: CI Astro

on:
  push:
    branches: [main]
  pull_request:
jobs:
  candidate-b:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: candidate-b-astro
    steps:
      - name: Check out the code
        uses: actions/checkout@v4
      - name: Check fixture parity between candidates
        working-directory:
        run: diff -u data/roles.json candidate-b-astro/data/roles.json
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: candidate-b-astro/package-lock.json
      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Type check
        run: npm run check

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build
